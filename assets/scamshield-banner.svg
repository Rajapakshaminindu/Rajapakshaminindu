<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-labelledby="title description">
  <title id="title">ScamShield AI</title>
  <desc id="description">Multimodal scam intelligence with a protective shield and connected signal nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101827"/>
      <stop offset="1" stop-color="#25172b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fb7185"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <style>
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 735px 120px; }
      @keyframes pulse { 0%, 100% { opacity: .65; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.04); } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
  </defs>
  <rect width="900" height="240" rx="18" fill="url(#bg)"/>
  <path d="M0 198H900" stroke="#fb7185" stroke-opacity=".35"/>
  <g fill="none" stroke="#fb7185" stroke-opacity=".2">
    <path d="M590 45h230M590 70h175M590 170h245M590 195h190"/>
    <path d="M645 30v180M850 30v180"/>
  </g>
  <g class="pulse">
    <path d="M735 49l61 22v47c0 38-25 64-61 83-36-19-61-45-61-83V71z" fill="#fb7185" fill-opacity=".12" stroke="url(#accent)" stroke-width="3"/>
    <path d="M708 120l18 18 39-43" fill="none" stroke="#ffe4e6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="650" cy="82" r="6" fill="#fb7185"/>
    <circle cx="823" cy="106" r="5" fill="#fdba74"/>
    <circle cx="811" cy="175" r="6" fill="#fb7185"/>
    <path d="M656 82l32 12m120 14l-20 1m16 62l-29-22" stroke="#fda4af" stroke-width="2"/>
  </g>
  <text x="48" y="50" fill="#fda4af" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3">MULTIMODAL SCAM INTELLIGENCE</text>
  <text x="48" y="112" fill="#fff7ed" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="750">ScamShield AI</text>
  <text x="50" y="146" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="17">Messages · screenshots · audio</text>
  <rect x="48" y="174" width="76" height="25" rx="12" fill="#fb7185" fill-opacity=".16"/>
  <text x="86" y="191" text-anchor="middle" fill="#fecdd3" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">DETECT</text>
  <rect x="134" y="174" width="76" height="25" rx="12" fill="#f97316" fill-opacity=".16"/>
  <text x="172" y="191" text-anchor="middle" fill="#fed7aa" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">EXPLAIN</text>
