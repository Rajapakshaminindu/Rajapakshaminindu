<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-labelledby="title description">
  <title id="title">E-Commerce Lakehouse</title>
  <desc id="description">Olist commerce data flows into a lakehouse and becomes predictive insights.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1e2b"/>
      <stop offset="1" stop-color="#102c3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <style>
      .spark { animation: spark 2.5s ease-in-out infinite; transform-origin: 790px 83px; }
      @keyframes spark { 0%, 100% { opacity: .65; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.1); } }
      @media (prefers-reduced-motion: reduce) { .spark { animation: none; } }
    </style>
  </defs>
  <rect width="900" height="240" rx="18" fill="url(#bg)"/>
  <g stroke="#67e8f9" stroke-opacity=".12">
    <path d="M560 42h295M560 82h295M560 122h295M560 162h295M560 202h295"/>
    <path d="M595 30v180M655 30v180M715 30v180M775 30v180M835 30v180"/>
  </g>
  <text x="48" y="50" fill="#67e8f9" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3">OLIST · DATA ENGINEERING &amp; PREDICTION</text>
  <text x="48" y="108" fill="#ecfeff" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="750">E-Commerce Lakehouse</text>
  <text x="50" y="143" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="17">From order data to predictive insight</text>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <rect x="48" y="172" width="97" height="28" rx="14" fill="#2dd4bf" fill-opacity=".14" stroke="#2dd4bf" stroke-opacity=".5"/>
    <text x="96" y="190" fill="#99f6e4" font-size="11" font-weight="700">PARQUET</text>
    <rect x="155" y="172" width="102" height="28" rx="14" fill="#38bdf8" fill-opacity=".14" stroke="#38bdf8" stroke-opacity=".5"/>
    <text x="206" y="190" fill="#bae6fd" font-size="11" font-weight="700">FORECASTS</text>
  </g>
  <g transform="translate(610 45)">
    <path d="M0 45l43-24 43 24-43 25z" fill="#2dd4bf" fill-opacity=".22" stroke="#5eead4" stroke-width="2"/>
    <path d="M0 45v53l43 25V70zm86 0v53l-43 25V70z" fill="#0e7490" fill-opacity=".28" stroke="#5eead4" stroke-opacity=".7" stroke-width="2"/>
    <path d="M108 101l39-25 38 9 44-48" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="spark" fill="#a5f3fc">
      <circle cx="108" cy="101" r="4"/>
      <circle cx="147" cy="76" r="4"/>
      <circle cx="185" cy="85" r="4"/>
      <circle cx="229" cy="37" r="5"/>
    </g>
    <path d="M229 37v-18m0 0l-7 8m7-8l7 8" stroke="#a5f3fc" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
