<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="title description">
  <title id="title">Minindu Rajapaksha | Data Engineering and Applied AI</title>
  <desc id="description">A dark navy profile banner with subtle teal and indigo motion.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="55%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#17152d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <style>
      .frame {
        fill: none;
        stroke: url(#edge);
        stroke-dasharray: 150 900;
        animation: trace 12s linear infinite;
      }
      .glow {
        transform-origin: 940px 150px;
        animation: breathe 8s ease-in-out infinite;
      }
      .orbit {
        transform-origin: 940px 150px;
        animation: rotate 32s linear infinite;
      }
      @keyframes trace {
        to { stroke-dashoffset: -1050; }
      }
      @keyframes breathe {
        0%, 100% { opacity: .55; transform: scale(.92); }
        50% { opacity: 1; transform: scale(1.08); }
      }
      @keyframes rotate {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .frame, .glow, .orbit { animation: none; }
      }
    </style>
  </defs>

  <rect x="8" y="8" width="1184" height="324" rx="24" fill="url(#background)"/>
  <rect x="8" y="8" width="1184" height="324" rx="24" fill="url(#grid)"/>
  <circle class="glow" cx="940" cy="150" r="205" fill="url(#aura)"/>
  <g class="orbit" fill="none" stroke="#64748b" stroke-opacity=".35">
    <ellipse cx="940" cy="150" rx="190" ry="74" transform="rotate(-24 940 150)"/>
    <ellipse cx="940" cy="150" rx="152" ry="108" transform="rotate(32 940 150)"/>
    <circle cx="1098" cy="87" r="4" fill="#2dd4bf" stroke="none"/>
    <circle cx="804" cy="217" r="3" fill="#a78bfa" stroke="none"/>
  </g>
  <rect class="frame" x="9" y="9" width="1182" height="322" rx="23" stroke-width="2"/>

  <g text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="600" y="96" fill="#2dd4bf" font-size="14" font-weight="700" letter-spacing="4">DATA ENGINEERING  /  APPLIED AI  /  ANALYTICS</text>
    <text x="600" y="160" fill="#f8fafc" font-size="48" font-weight="750" letter-spacing="1">MININDU RAJAPAKSHA</text>
    <text x="600" y="201" fill="#cbd5e1" font-size="19" font-weight="600" letter-spacing="2">SOFTWARE ENGINEERING UNDERGRADUATE</text>
    <text x="600" y="241" fill="#94a3b8" font-size="16">Building reliable data pipelines and turning data into useful insights.</text>
  </g>

  <g text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing=".5">
    <rect x="317" y="274" width="174" height="30" rx="15" fill="#13243a" stroke="#2dd4bf" stroke-opacity=".45"/>
    <text x="404" y="293" fill="#99f6e4">DATA PIPELINES</text>
    <rect x="513" y="274" width="174" height="30" rx="15" fill="#13243a" stroke="#38bdf8" stroke-opacity=".45"/>
    <text x="600" y="293" fill="#bae6fd">LAKEHOUSES</text>
    <rect x="709" y="274" width="174" height="30" rx="15" fill="#1b1b38" stroke="#a78bfa" stroke-opacity=".5"/>
    <text x="796" y="293" fill="#ddd6fe">MACHINE LEARNING</text>
  </g>
</svg>
