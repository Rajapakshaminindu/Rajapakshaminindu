<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0e1328" />
      <stop offset="100%" stop-color="#140b2e" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#818CF8;#C084FC;#38BDF8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8;#C084FC;#38BDF8;#818CF8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#C084FC">
        <animate attributeName="stop-color" values="#C084FC;#38BDF8;#818CF8;#C084FC" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#A78BFA;#38BDF8" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="borderGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: 2px;
        fill: url(#textShimmer);
      }
      .subtitle {
        font-family: 'Courier New', Courier, monospace, 'Fira Code';
        font-weight: 600;
        font-size: 19px;
        letter-spacing: 2px;
        fill: #38BDF8;
      }
      .tag {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #94A3B8;
        letter-spacing: 1px;
      }
      .grid-line {
        stroke: #1e293b;
        stroke-width: 0.8;
        stroke-dasharray: 4 4;
        opacity: 0.4;
      }
      .pulse-circle {
        animation: pulse 3s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.3); }
      }
      .circuit-line {
        stroke: #38BDF8;
        stroke-width: 1.5;
        stroke-dasharray: 100 200;
        animation: dash 6s linear infinite;
        opacity: 0.6;
      }
      @keyframes dash {
        to { stroke-dashoffset: -300; }
      }
    </style>
  </defs>

  <!-- Background Box -->
  <rect x="10" y="10" width="1180" height="320" rx="20" ry="20" fill="url(#bgGrad)" />

  <!-- Animated Circuit / Tech Lines -->
  <line x1="80" y1="60" x2="350" y2="60" class="circuit-line" />
  <circle cx="80" cy="60" r="3" fill="#38BDF8" />
  <circle cx="350" cy="60" r="3" fill="#38BDF8" />

  <line x1="850" y1="280" x2="1120" y2="280" class="circuit-line" />
  <circle cx="850" cy="280" r="3" fill="#A78BFA" />
  <circle cx="1120" cy="280" r="3" fill="#A78BFA" />

  <!-- Tech Grid Background Pattern -->
  <line x1="50" y1="110" x2="1150" y2="110" class="grid-line" />
  <line x1="50" y1="230" x2="1150" y2="230" class="grid-line" />
  <line x1="250" y1="20" x2="250" y2="320" class="grid-line" />
  <line x1="950" y1="20" x2="950" y2="320" class="grid-line" />

  <!-- Data Flow Constellation Nodes -->
  <g opacity="0.5">
    <circle cx="150" cy="180" r="4" fill="#38BDF8" />
    <line x1="150" y1="180" x2="210" y2="210" stroke="#38BDF8" stroke-width="1" />
    <circle cx="210" cy="210" r="3" fill="#818CF8" />

    <circle cx="1020" cy="130" r="4" fill="#C084FC" />
    <line x1="1020" y1="130" x2="1070" y2="160" stroke="#C084FC" stroke-width="1" />
    <circle cx="1070" cy="160" r="3" fill="#38BDF8" />
  </g>

  <!-- Glowing Border -->
  <rect x="10" y="10" width="1180" height="320" rx="20" ry="20" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" filter="url(#borderGlow)" />

  <!-- Terminal Dot Indicators (Mac Style) -->
  <g transform="translate(45, 38)">
    <circle cx="0" cy="0" r="6" fill="#EF4444" opacity="0.8" />
    <circle cx="20" cy="0" r="6" fill="#F59E0B" opacity="0.8" />
    <circle cx="40" cy="0" r="6" fill="#10B981" opacity="0.8" />
    <text x="60" y="4" font-family="'Courier New', monospace" font-size="12" fill="#64748B">profile.sys // data-engineer-mode</text>
  </g>

  <!-- Main Animated Name -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="150" class="title" filter="url(#glow)">MININDU RAJAPAKSHA</text>

    <!-- Subtitle exact user string -->
    <text x="600" y="195" class="subtitle">SOFTWARE ENGINEERING UNDERGRADUATE</text>
    <text x="600" y="225" font-family="'Courier New', Courier, monospace, 'Fira Code'" font-size="17" font-weight="500" fill="#E2E8F0" letter-spacing="1.5px">• ASPIRING DATA SCIENTIST AND DATA ENGINEERING •</text>

    <!-- Badges / Domain Tags inside Header -->
    <g transform="translate(600, 275)">
      <!-- Pill 1 -->
      <rect x="-370" y="-18" width="220" height="28" rx="14" ry="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="-260" y="0" text-anchor="middle" class="tag" fill="#38BDF8">⚡ Medallion Lakehouses</text>

      <!-- Pill 2 -->
      <rect x="-115" y="-18" width="230" height="28" rx="14" ry="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="0" y="0" text-anchor="middle" class="tag" fill="#A78BFA">🧠 Applied Multimodal AI</text>

      <!-- Pill 3 -->
      <rect x="150" y="-18" width="220" height="28" rx="14" ry="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="260" y="0" text-anchor="middle" class="tag" fill="#34D399">📊 Modern Analytics &amp; BI</text>
    </g>
  </g>
</svg>
